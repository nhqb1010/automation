# LEARN: YOU ARE HERE
#   used by ▶ make lint and VS Code ▶ THIS FILE sets Ruff's rules
#   ▶ every .py file is checked against them
#   read next → example.env

# LEARN: Ruff = a linter (finds bugs and style problems) + formatter
#   extend → start from the shared personal config, then add the lines below
extend = "~/.config/ruff/ruff.toml"

# LEARN: per-file-ignores → switch off a rule for some files only
#   "tests/**" = every file under tests/ (** = any depth)
#   S101 = "assert used", PLR2004 = "magic number", S603 = "subprocess call",
#   E501 = "line too long"

# tests use plain assert, literal expected values and made-up tokens by design
#   S106 = "hardcoded password" (a fake token like "tok" in a test)
[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S106"]
# fixed macOS tools only (sysctl, hdiutil, ioreg, git), never user input
"app/build_info.py" = ["S603"]
"app/tools/system_monitor/cpu_memory.py" = ["S603"]
"app/tools/system_monitor/storage.py" = ["S603"]
"app/tools/system_monitor/power.py" = ["S603"]
"app/tools/system_monitor/mac_info.py" = ["S603"]
# Apple's method names are longer than the line limit
"app/tools/system_monitor/app_icons.py" = ["E501"]
# draws the icon: Apple's long method names + one fixed macOS tool (iconutil)
"mac_app/make_icon.py" = ["E501", "S603"]
# S311 = "random isn't safe for passwords / keys" → here it only picks a quote
"app/tools/daily_commit/repo_template/**" = ["S311"]

# LEARN: per-file-target-version → which Python a file must still run on
#   the template runs on GitHub's runner (Python 3.12), not this project's 3.14
#   → Ruff won't suggest, or format into, anything newer than 3.12 there
[per-file-target-version]
"app/tools/daily_commit/repo_template/**" = "py312"
