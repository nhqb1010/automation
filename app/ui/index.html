<!doctype html>
<!-- LEARN: YOU ARE HERE
       main.py opens the window ▶ pywebview loads THIS PAGE
       ▶ the 4 scripts at the bottom fill it in and talk to Python (bridge.py)
       read next → app/ui/style.css -->

<!-- LEARN: the app shell = the frame that stays put (sidebar + empty content
     area); tools are swapped into the content area, the page never reloads
     industry term: "single-page app" (SPA)

       ┌──────────┬──────────────────────────┐
       │ sidebar  │ content (#view)          │
       │  tools   │   current tool or        │
       │  ...     │   the Settings page      │
       │ Settings │                          │
       └──────────┴──────────────────────────┘ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- LEARN: viewport = "page width = window width, no zoom" -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bao Internal Apps</title>
  <!-- LEARN: link rel="stylesheet" → load the CSS file (all the looks) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LEARN: id="…" = a unique name the scripts use to find an element
       class="…" = a style name (style.css), many elements can share one -->
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name">Bao Internal Apps</span>
        <!-- empty → shell.js puts the icon in; title = hover tooltip -->
        <button class="icon-btn" id="collapse-btn" title="Collapse sidebar (⌘\)"></button>
      </div>
      <!-- empty → shell.js adds one entry per tool (from bridge list_tools) -->
      <nav class="nav" id="tool-nav"></nav>
      <!-- grows to push Settings to the bottom -->
      <div class="nav-spacer"></div>
      <!-- LEARN: data-… = your own extra info on an element
           JS reads it as element.dataset.view → "settings"
           data-icon → shell.js swaps in that icon from icons.js -->
      <div class="nav-item" id="settings-nav" data-view="settings" title="Settings (⌘,)">
        <span class="nav-icon" data-icon="settings"></span>
        <span class="label">Settings</span>
        <span class="kbd">⌘,</span>
      </div>
    </aside>
    <!-- the tool / Settings page is drawn in here -->
    <main class="content" id="view"></main>
  </div>

  <!-- LEARN: scripts run top to bottom, in this order
       each one adds one global (window.BaoIcons, …) the next ones use
       → shell.js is last because it needs all the others
       at the end of body → the elements above exist when they run -->
  <script src="icons.js"></script>
  <script src="charts.js"></script>
  <script src="settings.js"></script>
  <script src="shell.js"></script>
</body>
</html>
