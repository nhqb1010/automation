<div class="sm">
  <div class="page-head">
    <h1>System Monitor</h1>
    <div class="meta"><span class="live-dot"></span><span class="sm-refresh-label">Live</span></div>
  </div>

  <div class="sm-grid">
    <section class="card loading sm-cpu">
      <div class="card-title"><span data-icon="cpu"></span>CPU</div>
      <div class="sm-hero">
        <div class="sm-cpu-ring"></div>
        <div class="sm-hero-side">
          <div class="stat-line">Load avg <b class="num sm-load">—</b></div>
          <div class="stat-line sm-core-summary"></div>
          <svg class="spark sm-cpu-spark"></svg>
        </div>
      </div>
      <div class="sm-cores"></div>
      <div class="legend sm-core-legend">
        <span><i style="background: var(--e-core)"></i>Efficiency</span>
        <span><i style="background: var(--p-core)"></i>Performance</span>
      </div>
      <button class="top-toggle" data-list="cpu"><span data-icon="chevron-right"></span>Top apps</button>
      <div class="top-list sm-cpu-top"></div>
    </section>

    <section class="card loading sm-memory">
      <div class="card-title"><span data-icon="memory"></span>Memory</div>
      <div class="sm-hero">
        <div class="sm-memory-ring"></div>
        <div class="sm-hero-side">
          <div class="stat-line"><b class="num sm-memory-used">—</b> of <b class="num sm-memory-total">—</b> used</div>
          <div class="stat-line">Swap <b class="num sm-swap">—</b></div>
          <svg class="spark sm-memory-spark"></svg>
        </div>
      </div>
      <button class="top-toggle" data-list="memory"><span data-icon="chevron-right"></span>Top apps</button>
      <div class="top-list sm-memory-top"></div>
    </section>

    <section class="card loading sm-temperature">
      <div class="card-title"><span data-icon="thermometer"></span>Temperature</div>
      <div class="sm-gauges">
        <div class="gauge sm-cpu-gauge"></div>
        <div class="gauge sm-gpu-gauge"></div>
      </div>
      <svg class="spark sm-temp-spark"></svg>
      <div class="legend">
        <span><i style="background: var(--series-1)"></i><span class="sm-temp-legend">CPU</span></span>
        <span class="sm-legend-gpu"><i style="background: var(--series-2)"></i>GPU</span>
        <span>hottest · 30–100°C</span>
      </div>
      <div class="sm-unavailable">
        <div class="sm-unavailable-icon" data-icon="thermometer"></div>
        <div>Temperature unavailable</div>
        <div class="sm-unavailable-reason"></div>
      </div>
    </section>

    <section class="card loading sm-storage">
      <div class="card-title"><span data-icon="hard-drive"></span>Storage<span class="sm-storage-note">updates every 30s</span></div>
      <div class="sm-drives"></div>
    </section>
  </div>
</div>
